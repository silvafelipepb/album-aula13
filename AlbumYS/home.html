
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Yasmin Sensação | Álbum Musical</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topo">

    <main class="container">

        <section class="apresentacao">

                height="1200">

            <div class="detalhes">

                <p class="nome-musica">

                </p>

                <!-- PLAYER DE ÁUDIO -->
                <audio controls preload="metadata">
                    <source
                        src="audio/Yasmin Sensação - Fanatismo (Repertório Fim de Ano Ao Vivo)(MP3_160K).mp3"

                </audio>

            <div

                    <thead>
                        <tr>

                            <th scope="col">Título</th>

                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <th scope="row">01</th>
                            <td>Fanatismo</td>
                            <td>2:30</td>
   
                        
                        </tr>
                    </tfoot>

            </div>

    <footer class="rodape">
        <p>
            aula 13 de front
        </p>
    </footer>
